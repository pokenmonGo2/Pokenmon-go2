<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokenmon go2</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  touch-action: none;
}

#game {
  width: 100vw;
  height: 100vh;
}

#title {
  position: fixed;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  background: white;
  padding: 10px 18px;
  border-radius: 15px;
  font-weight: bold;
  z-index: 20;
}

#collectionButton {
  position: fixed;
  top: 15px;
  right: 15px;
  border: none;
  background: white;
  padding: 12px 15px;
  border-radius: 15px;
  font-weight: bold;
  z-index: 20;
}

#joystick {
  position: fixed;
  bottom: 30px;
  left: 30px;
  width: 120px;
  height: 120px;
  background: rgba(255,255,255,0.35);
  border: 3px solid white;
  border-radius: 50%;
  z-index: 20;
}

#stick {
  position: absolute;
  width: 55px;
  height: 55px;
  left: 32px;
  top: 32px;
  background: rgba(50,50,50,0.7);
  border-radius: 50%;
}

#message {
  display: none;
  position: fixed;
  left: 50%;
  bottom: 180px;
  transform: translateX(-50%);
  background: white;
  padding: 15px 22px;
  border-radius: 18px;
  font-size: 17px;
  font-weight: bold;
  text-align: center;
  z-index: 40;
}

#catchScreen,
#collectionScreen {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  z-index: 50;
  align-items: center;
  justify-content: center;
}

.panel {
  width: 85%;
  max-width: 360px;
  background: white;
  border-radius: 25px;
  padding: 25px;
  text-align: center;
}

.monsterIcon {
  font-size: 90px;
}

.orb {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 5px solid #222;
  background: linear-gradient(
    #55aaff 0%,
    #55aaff 48%,
    white 48%,
    white 52%,
    #eeeeee 52%
  );
  margin: 20px auto;
  display: block;
}

.closeButton,
.mainButton {
  border: none;
  padding: 13px 22px;
  border-radius: 15px;
  font-weight: bold;
  font-size: 16px;
  margin-top: 8px;
}

.mainButton {
  background: #3366ff;
  color: white;
}

#collectionList {
  max-height: 260px;
  overflow-y: auto;
}

.monsterCard {
  background: #f0f0f0;
  margin: 8px 0;
  padding: 12px;
  border-radius: 15px;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="title">🌍 Pokenmon go2</div>

<button id="collectionButton">
🎒 Mijn monsters
</button>

<div id="game"></div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="message"></div>


<!-- VANGSCHERM -->

<div id="catchScreen">

  <div class="panel">

    <h2 id="catchTitle">
      👾 Monster gevonden!
    </h2>

    <div
      class="monsterIcon"
      id="catchIcon">
      👾
    </div>

    <p id="catchDescription">
      Tik op de Monster Orb!
    </p>

    <button
      class="orb"
      id="orbButton">
    </button>

    <p id="catchText">
      Vang het monster!
    </p>

    <button
      class="closeButton"
      id="closeCatch">
      Terug
    </button>

  </div>

</div>


<!-- VERZAMELING -->

<div id="collectionScreen">

  <div class="panel">

    <h2>🎒 Mijn monsters</h2>

    <div id="collectionList"></div>

    <button
      class="closeButton"
      id="closeCollection">
      Sluiten
    </button>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

// ==================================================
// WERELD
// ==================================================

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0x87ceeb);


// ==================================================
// CAMERA
// ==================================================

const camera =
  new THREE.PerspectiveCamera(
    70,
    window.innerWidth /
    window.innerHeight,
    0.1,
    1000
  );

camera.position.set(
  0,
  7,
  12
);


// ==================================================
// RENDERER
// ==================================================

const renderer =
  new THREE.WebGLRenderer({
    antialias: true
  });

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

document
  .getElementById("game")
  .appendChild(renderer.domElement);


// ==================================================
// LICHT
// ==================================================

const sun =
  new THREE.DirectionalLight(
    0xffffff,
    2
  );

sun.position.set(
  10,
  20,
  10
);

scene.add(sun);

scene.add(
  new THREE.AmbientLight(
    0xffffff,
    0.6
  )
);


// ==================================================
// GROND
// ==================================================

const ground =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      150,
      150
    ),
    new THREE.MeshStandardMaterial({
      color: 0x55aa55
    })
  );

ground.rotation.x =
  -Math.PI / 2;

scene.add(ground);


// ==================================================
// WEG
// ==================================================

function createRoad(
  x,
  z,
  width,
  length,
  rotation = 0
) {

  const road =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        width,
        length
      ),
      new THREE.MeshStandardMaterial({
        color: 0x777777
      })
    );

  road.rotation.x =
    -Math.PI / 2;

  road.rotation.z =
    rotation;

  road.position.set(
    x,
    0.01,
    z
  );

  scene.add(road);
}


// Horizontale weg
createRoad(
  0,
  0,
  8,
  150
);


// Verticale weg
createRoad(
  0,
  0,
  8,
  150,
  Math.PI / 2
);


// ==================================================
// BOMEN
// ==================================================

function createTree(
  x,
  z
) {

  const tree =
    new THREE.Group();


  // Stam

  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.3,
        0.4,
        2,
        10
      ),
      new THREE.MeshStandardMaterial({
        color: 0x8b5a2b
      })
    );

  trunk.position.y = 1;

  tree.add(trunk);


  // Bladeren

  const leaves =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        1.4,
        12,
        12
      ),
      new THREE.MeshStandardMaterial({
        color: 0x228b22
      })
    );

  leaves.position.y = 2.7;

  tree.add(leaves);


  tree.position.set(
    x,
    0,
    z
  );

  scene.add(tree);
}


// Bomen plaatsen

const treePositions = [

  [-12,-12],
  [-18,-4],
  [-13,10],
  [-20,15],
  [12,-15],
  [18,-8],
  [14,8],
  [20,15],
  [-30,0],
  [30,0],
  [0,-25],
  [0,25]

];


treePositions.forEach(
  position => {

    createTree(
      position[0],
      position[1]
    );

  }
);


// ==================================================
// ROTSEN
// ==================================================

function createRock(
  x,
  z
) {

  const rock =
    new THREE.Mesh(
      new THREE.DodecahedronGeometry(
        0.8,
        0
      ),
      new THREE.MeshStandardMaterial({
        color: 0x777777
      })
    );

  rock.position.set(
    x,
    0.7,
    z
  );

  scene.add(rock);
}


createRock(
  -8,
  -8
);

createRock(
  10,
  -10
);

createRock(
  9,
  14
);

createRock(
  -15,
  16
);


// ==================================================
// HUISJES
// ==================================================

function createHouse(
  x,
  z
) {

  const house =
    new THREE.Group();


  // Huis

  const base =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        4,
        3,
        4
      ),
      new THREE.MeshStandardMaterial({
        color: 0xffcc88
      })
    );

  base.position.y = 1.5;

  house.add(base);


  // Dak

  const roof =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        3.2,
        2,
        4
      ),
      new THREE.MeshStandardMaterial({
        color: 0xcc4444
      })
    );

  roof.position.y = 4;

  roof.rotation.y =
    Math.PI / 4;

  house.add(roof);


  // Deur

  const door =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        0.8,
        1.5,
        0.15
      ),
      new THREE.MeshStandardMaterial({
        color: 0x553311
      })
    );

  door.position.set(
    0,
    0.75,
    -2.05
  );

  house.add(door);


  house.position.set(
    x,
    0,
    z
  );

  scene.add(house);
}


createHouse(
  -10,
  10
);

createHouse(
  10,
  10
);


// ==================================================
// SPELER
// ==================================================

const player =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      1,
      2,
      1
    ),
    new THREE.MeshStandardMaterial({
      color: 0x3366ff
    })
  );

player.position.set(
  0,
  1,
  0
);

scene.add(player);


// ==================================================
// MONSTERS
// ==================================================

const monsters = [];


// Monster maken

function createMonster(
  name,
  emoji,
  color,
  x,
  z
) {

  const monster =
    new THREE.Group();


  // Lichaam

  const body =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        1,
        20,
        20
      ),
      new THREE.MeshStandardMaterial({
        color: color
      })
    );

  body.position.y = 1.2;

  monster.add(body);


  // Ogen

  const eyeMaterial =
    new THREE.MeshStandardMaterial({
      color: 0xffffff
    });


  const pupilMaterial =
    new THREE.MeshStandardMaterial({
      color: 0x111111
    });


  const leftEye =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        0.18,
        12,
        12
      ),
      eyeMaterial
    );

  leftEye.position.set(
    -0.35,
    1.5,
    -0.85
  );

  monster.add(leftEye);


  const rightEye =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        0.18,
        12,
        12
      ),
      eyeMaterial
    );

  rightEye.position.set(
    0.35,
    1.5,
    -0.85
  );

  monster.add(rightEye);


  // Pupillen

  const leftPupil =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        0.08,
        10,
        10
      ),
      pupilMaterial
    );

  leftPupil.position.set(
    -0.35,
    1.5,
    -1
  );

  monster.add(leftPupil);


  const rightPupil =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        0.08,
        10,
        10
      ),
      pupilMaterial
    );

  rightPupil.position.set(
    0.35,
    1.5,
    -1
  );

  monster.add(rightPupil);


  // Voeten

  const footMaterial =
    new THREE.MeshStandardMaterial({
      color: 0xff5533
    });


  const leftFoot =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        0.3,
        12,
        12
      ),
      footMaterial
    );

  leftFoot.position.set(
    -0.45,
    0.3,
    -0.1
  );

  monster.add(leftFoot);


  const rightFoot =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        0.3,
        12,
        12
      ),
      footMaterial
    );

  rightFoot.position.set(
    0.45,
    0.3,
    -0.1
  );

  monster.add(rightFoot);


  monster.position.set(
    x,
    0,
    z
  );


  monster.userData = {
    name: name,
    emoji: emoji,
    caught: false
  };


  scene.add(monster);

  monsters.push(monster);
}


// Drie eigen monsters

createMonster(
  "Firebo",
  "🔥",
  0xff6633,
  8,
  -8
);


createMonster(
  "Leafy",
  "🌿",
  0x33bb55,
  -8,
  -10
);


createMonster(
  "Aquari",
  "💧",
  0x3399ff,
  12,
  12
);


// ==================================================
// JOYSTICK
// ==================================================

const joystick =
  document.getElementById(
    "joystick"
  );

const stick =
  document.getElementById(
    "stick"
  );


let joystickX = 0;
let joystickY = 0;
let touching = false;


joystick.addEventListener(
  "touchstart",
  function(event) {

    touching = true;

    event.preventDefault();

  },
  { passive:false }
);


joystick.addEventListener(
  "touchmove",
  function(event) {

    if (!touching) return;

    event.preventDefault();


    const touch =
      event.touches[0];


    const rect =
      joystick.getBoundingClientRect();


    let x =
      touch.clientX -
      (
        rect.left +
        rect.width / 2
      );


    let y =
      touch.clientY -
      (
        rect.top +
        rect.height / 2
      );


    const max = 45;


    const distance =
      Math.sqrt(
        x*x +
        y*y
      );


    if (distance > max) {

      x =
        x / distance * max;

      y =
        y / distance * max;

    }


    joystickX =
      x / max;

    joystickY =
      y / max;


    stick.style.transform =
      `translate(${x}px, ${y}px)`;

  },
  { passive:false }
);


joystick.addEventListener(
  "touchend",
  function() {

    touching = false;

    joystickX = 0;
    joystickY = 0;

    stick.style.transform =
      "translate(0px,0px)";

  }
);


// ==================================================
// VANGEN
// ==================================================

let selectedMonster = null;


const raycaster =
  new THREE.Raycaster();


const mouse =
  new THREE.Vector2();


renderer.domElement.addEventListener(
  "touchstart",
  function(event) {

    if (
      event.target.closest(
        "#joystick"
      )
    ) {
      return;
    }


    const touch =
      event.touches[0];


    mouse.x =
      (
        touch.clientX /
        window.innerWidth
      ) * 2 - 1;


    mouse.y =
      -(
        touch.clientY /
        window.innerHeight
      ) * 2 + 1;


    raycaster.setFromCamera(
      mouse,
      camera
    );


    const allObjects = [];


    monsters.forEach(
      monster => {

        if (!monster.userData.caught) {

          monster.children.forEach(
            child => {

              allObjects.push(
                child
              );

            }
          );

        }

      }
    );


    const hits =
      raycaster.intersectObjects(
        allObjects,
        true
      );


    if (hits.length === 0) {
      return;
    }


    let selected =
      hits[0].object;


    while (
      selected.parent &&
      !monsters.includes(selected)
    ) {

      selected =
        selected.parent;

    }


    if (
      !monsters.includes(selected)
    ) {
      return;
    }


    selectedMonster =
      selected;


    const distance =
      player.position.distanceTo(
        selectedMonster.position
      );


    if (distance <= 6) {

      openCatchScreen(
        selectedMonster
      );

    } else {

      showMessage(
        "🚶 Je bent nog te ver weg!"
      );

    }

  }
);


// ==================================================
// VANGSCHERM
// ==================================================

function openCatchScreen(
  monster
) {

  document
    .getElementById(
      "catchTitle"
    )
    .innerText =
    monster.userData.name +
    " gevonden!";


  document
    .getElementById(
      "catchIcon"
    )
    .innerText =
    monster.userData.emoji;


  document
    .getElementById(
      "catchText"
    )
    .innerText =
    "Tik op de Monster Orb!";


  document
    .getElementById(
      "catchScreen"
    )
    .style.display =
    "flex";

}


// ==================================================
// MONSTER VANGEN
// ==================================================

document
  .getElementById(
    "orbButton"
  )
  .addEventListener(
    "click",
    function() {

      if (!selectedMonster) {
        return;
      }


      if (
        selectedMonster.userData.caught
      ) {
        return;
      }


      document
        .getElementById(
          "catchText"
        )
        .innerText =
        "✨ Vangen...";


      const orb =
        document.getElementById(
          "orbButton"
        );


      orb.style.transform =
        "scale(1.25)";


      setTimeout(
        function() {

          orb.style.transform =
            "scale(1)";


          selectedMonster
            .userData
            .caught = true;


          selectedMonster.visible =
            false;


          saveMonster(
            selectedMonster
          );


          document
            .getElementById(
              "catchText"
            )
            .innerText =
            "🎉 Gevangen!";


          setTimeout(
            function() {

              document
                .getElementById(
                  "catchScreen"
                )
                .style.display =
                "none";


              updateCollection();

            },
            1000
          );


        },
        700
      );

    }
  );


// ==================================================
// OPSLAAN
// ==================================================

function getCollection() {

  const saved =
    localStorage.getItem(
      "pokenmonGo2Collection"
    );


  if (!saved) {
    return [];
  }


  try {

    return JSON.parse(
      saved
    );

  } catch {

    return [];

  }

}


function saveMonster(
  monster
) {

  const collection =
    getCollection();


  collection.push({
    name:
      monster.userData.name,

    emoji:
      monster.userData.emoji
  });


  localStorage.setItem(
    "pokenmonGo2Collection",
    JSON.stringify(
      collection
    )
  );

}


// ==================================================
// VERZAMELING
// ==================================================

function updateCollection() {

  const list =
    document.getElementById(
      "collectionList"
    );


  list.innerHTML = "";


  const collection =
    getCollection();


  if (
    collection.length === 0
  ) {

    list.innerHTML =
      "Je hebt nog geen monsters.";

    return;

  }


  collection.forEach(
    monster => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "monsterCard";


      card.innerText =
        monster.emoji +
        " " +
        monster.name;


      list.appendChild(
        card
      );

    }
  );

}


document
  .getElementById(
    "collectionButton"
  )
  .addEventListener(
    "click",
    function() {

      updateCollection();

      document
        .getElementById(
          "collectionScreen"
        )
        .style.display =
        "flex";

    }
  );


document
  .getElementById(
    "closeCollection"
  )
  .addEventListener(
    "click",
    function() {

      document
        .getElementById(
          "collectionScreen"
        )
        .style.display =
        "none";

    }
  );


document
  .getElementById(
    "closeCatch"
  )
  .addEventListener(
    "click",
    function() {

      document
        .getElementById(
          "catchScreen"
        )
        .style.display =
        "none";

    }
  );


// ==================================================
// MELDING
// ==================================================

function showMessage(
  text
) {

  const message =
    document.getElementById(
      "message"
    );


  message.innerText =
    text;


  message.style.display =
    "block";


  setTimeout(
    function() {

      message.style.display =
        "none";

    },
    2000
  );

}


// ==================================================
// GAME LOOP
// ==================================================

function animate() {

  requestAnimationFrame(
    animate
  );


  // Bewegen

  player.position.x +=
    joystickX * 0.12;


  player.position.z +=
    joystickY * 0.12;


  // Wereldgrenzen

  player.position.x =
    Math.max(
      -70,
      Math.min(
        70,
        player.position.x
      )
    );


  player.position.z =
    Math.max(
      -70,
      Math.min(
        70,
        player.position.z
      )
    );


  // Camera

  camera.position.x =
    player.position.x;


  camera.position.z =
    player.position.z + 12;


  camera.lookAt(
    player.position
  );


  // Monsters laten bewegen

  monsters.forEach(
    monster => {

      if (
        !monster.userData.caught
      ) {

        monster.rotation.y +=
          0.01;

      }

    }
  );


  renderer.render(
    scene,
    camera
  );

}


animate();


// ==================================================
// RESIZE
// ==================================================

window.addEventListener(
  "resize",
  function() {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
