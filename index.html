<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pokenmon go2</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #87ceeb;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    #ui {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      pointer-events: none;
    }

    #title {
      display: inline-block;
      background: rgba(0,0,0,0.65);
      color: white;
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: bold;
    }

    #gpsButton,
    #collectionButton {
      pointer-events: auto;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      margin-top: 8px;
      font-size: 15px;
      font-weight: bold;
      color: white;
      background: #333;
    }

    #collectionButton {
      background: #7b3ff2;
    }

    #locationStatus {
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 7px 10px;
      border-radius: 10px;
      margin-top: 6px;
      display: inline-block;
      font-size: 13px;
    }

    #message {
      position: fixed;
      left: 50%;
      bottom: 135px;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 12px 18px;
      border-radius: 14px;
      display: none;
      text-align: center;
      max-width: 80%;
    }

    #collection {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(0,0,0,0.9);
      color: white;
      display: none;
      padding: 25px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    #collection h2 {
      margin-top: 0;
    }

    .monsterCard {
      background: #222;
      border-radius: 15px;
      padding: 15px;
      margin: 10px 0;
      font-size: 18px;
    }

    #closeCollection {
      border: none;
      background: #e74c3c;
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: bold;
    }

    #joystick {
      position: fixed;
      left: 25px;
      bottom: 25px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(0,0,0,0.25);
      z-index: 15;
    }

    #stick {
      position: absolute;
      left: 35px;
      top: 35px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255,255,255,0.75);
    }

    #catchScreen {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(20,20,20,0.95);
      color: white;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }

    #catchMonster {
      font-size: 100px;
      margin: 20px;
    }

    #throwButton,
    #cancelButton {
      border: none;
      border-radius: 15px;
      padding: 14px 25px;
      margin: 6px;
      font-size: 18px;
      font-weight: bold;
    }

    #throwButton {
      background: #ff8c00;
      color: white;
    }

    #cancelButton {
      background: #555;
      color: white;
    }
  </style>
</head>

<body>

<div id="game"></div>

<div id="ui">
  <div id="title">🌍 Pokenmon go2</div><br>

  <button id="gpsButton">📍 GPS starten</button>
  <button id="collectionButton">🎒 Mijn monsters</button>

  <div id="locationStatus">
    GPS staat uit
  </div>
</div>

<div id="message"></div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="collection">
  <h2>🎒 Mijn monsters</h2>
  <div id="monsterList"></div>
  <button id="closeCollection">Sluiten</button>
</div>

<div id="catchScreen">
  <h1>Een monster!</h1>
  <div id="catchMonster">👾</div>
  <div id="catchName">Monster</div>
  <button id="throwButton">🟠 Gooi Monster Orb</button>
  <button id="cancelButton">Terug</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
/* =========================
   BASIS
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

document.getElementById("game").appendChild(renderer.domElement);


/* =========================
   LICHT
========================= */

const sunlight = new THREE.DirectionalLight(0xffffff, 1);
sunlight.position.set(20, 30, 10);
scene.add(sunlight);

const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);


/* =========================
   GROND
========================= */

const groundGeometry = new THREE.PlaneGeometry(500, 500);
const groundMaterial = new THREE.MeshLambertMaterial({
  color: 0x4caf50
});

const ground = new THREE.Mesh(
  groundGeometry,
  groundMaterial
);

ground.rotation.x = -Math.PI / 2;
scene.add(ground);


/* =========================
   WEG
========================= */

const roadGeometry = new THREE.PlaneGeometry(15, 500);

const roadMaterial = new THREE.MeshLambertMaterial({
  color: 0x555555
});

const road = new THREE.Mesh(
  roadGeometry,
  roadMaterial
);

road.rotation.x = -Math.PI / 2;
road.position.y = 0.01;

scene.add(road);


/* =========================
   SPELER
========================= */

const playerGeometry = new THREE.BoxGeometry(1.5, 2, 1.5);

const playerMaterial = new THREE.MeshLambertMaterial({
  color: 0x2196f3
});

const player = new THREE.Mesh(
  playerGeometry,
  playerMaterial
);

player.position.set(0, 1, 0);

scene.add(player);


/* =========================
   MONSTERS
========================= */

const monsters = [];

function createMonster(name, emoji, x, z) {

  const geometry = new THREE.SphereGeometry(1.2, 24, 24);

  let color = 0xff9800;

  if (name === "Leafy") color = 0x4caf50;
  if (name === "Aquari") color = 0x2196f3;

  const material = new THREE.MeshLambertMaterial({
    color: color
  });

  const monster = new THREE.Mesh(
    geometry,
    material
  );

  monster.position.set(x, 1.2, z);

  monster.userData = {
    name: name,
    emoji: emoji,
    caught: false
  };

  scene.add(monster);
  monsters.push(monster);
}


/* Eerste monsters */

createMonster("Firebo", "🔥", 8, -12);
createMonster("Leafy", "🌿", -10, -25);
createMonster("Aquari", "💧", 12, -40);


/* =========================
   BOMEN
========================= */

function createTree(x, z) {

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.4, 0.5, 2, 8),
    new THREE.MeshLambertMaterial({
      color: 0x795548
    })
  );

  trunk.position.set(x, 1, z);

  scene.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(1.8, 12, 12),
    new THREE.MeshLambertMaterial({
      color: 0x2e7d32
    })
  );

  leaves.position.set(x, 3, z);

  scene.add(leaves);
}

for (let i = -100; i <= 100; i += 12) {
  createTree(-12, i);
  createTree(12, i + 6);
}


/* =========================
   HUIZEN
========================= */

function createHouse(x, z) {

  const house = new THREE.Mesh(
    new THREE.BoxGeometry(5, 4, 5),
    new THREE.MeshLambertMaterial({
      color: 0xffcc80
    })
  );

  house.position.set(x, 2, z);

  scene.add(house);

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(4, 2.5, 4),
    new THREE.MeshLambertMaterial({
      color: 0xd84315
    })
  );

  roof.position.set(x, 5, z);
  roof.rotation.y = Math.PI / 4;

  scene.add(roof);
}

createHouse(-22, -15);
createHouse(22, -35);


/* =========================
   GPS
========================= */

let gpsActive = false;

let gpsOriginLat = null;
let gpsOriginLon = null;

let gpsWatchId = null;

const locationStatus =
  document.getElementById("locationStatus");

const gpsButton =
  document.getElementById("gpsButton");


function startGPS() {

  if (!navigator.geolocation) {

    locationStatus.textContent =
      "❌ GPS wordt niet ondersteund.";

    return;
  }

  locationStatus.textContent =
    "📡 GPS zoeken...";

  gpsWatchId =
    navigator.geolocation.watchPosition(

      function(position) {

        const latitude =
          position.coords.latitude;

        const longitude =
          position.coords.longitude;

        /*
          Eerste GPS-positie wordt het startpunt.

          De GPS-gegevens blijven alleen in deze browser.
        */

        if (gpsOriginLat === null) {

          gpsOriginLat = latitude;
          gpsOriginLon = longitude;

          locationStatus.textContent =
            "✅ GPS actief";
        }


        /*
          Zet GPS om naar meters.

          Ongeveer:
          1 graad breedte = 111.320 meter
        */

        const metersPerDegree = 111320;

        const latitudeMeters =
          (latitude - gpsOriginLat) *
          metersPerDegree;

        const longitudeMeters =
          (longitude - gpsOriginLon) *
          metersPerDegree *
          Math.cos(
            gpsOriginLat * Math.PI / 180
          );


        /*
          Schaal:

          5 meter in de echte wereld
          = ongeveer 1 game-unit
        */

        const scale = 5;

        const worldX =
          longitudeMeters / scale;

        const worldZ =
          -latitudeMeters / scale;


        /*
          GPS bestuurt nu de speler.
        */

        player.position.x = worldX;
        player.position.z = worldZ;


        locationStatus.textContent =
          "📍 GPS actief";
      },

      function(error) {

        locationStatus.textContent =
          "❌ GPS kon niet worden gebruikt.";

        console.log(error);
      },

      {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 10000
      }
    );

  gpsActive = true;

  gpsButton.textContent =
    "📍 GPS actief";
}


gpsButton.addEventListener(
  "click",
  startGPS
);


/* =========================
   JOYSTICK
========================= */

const joystick =
  document.getElementById("joystick");

const stick =
  document.getElementById("stick");

let joystickActive = false;

let joystickX = 0;
let joystickY = 0;


joystick.addEventListener(
  "touchstart",
  function(event) {

    joystickActive = true;

    event.preventDefault();
  },
  { passive: false }
);


joystick.addEventListener(
  "touchmove",
  function(event) {

    if (!joystickActive) return;

    const touch =
      event.touches[0];

    const rect =
      joystick.getBoundingClientRect();

    let x =
      touch.clientX -
      (rect.left + rect.width / 2);

    let y =
      touch.clientY -
      (rect.top + rect.height / 2);

    const maxDistance = 35;

    const distance =
      Math.sqrt(x*x + y*y);

    if (distance > maxDistance) {

      x =
        x / distance *
        maxDistance;

      y =
        y / distance *
        maxDistance;
    }

    joystickX =
      x / maxDistance;

    joystickY =
      y / maxDistance;

    stick.style.transform =
      `translate(${x}px, ${y}px)`;

    event.preventDefault();
  },
  { passive: false }
);


joystick.addEventListener(
  "touchend",
  function() {

    joystickActive = false;

    joystickX = 0;
    joystickY = 0;

    stick.style.transform =
      "translate(0px, 0px)";
  }
);


/* =========================
   MONSTER KLIKKEN
========================= */

let selectedMonster = null;

const catchScreen =
  document.getElementById("catchScreen");

const catchMonster =
  document.getElementById("catchMonster");

const catchName =
  document.getElementById("catchName");


renderer.domElement.addEventListener(
  "touchstart",
  function(event) {

    const touch =
      event.touches[0];

    const mouse =
      new THREE.Vector2();

    mouse.x =
      (touch.clientX /
      window.innerWidth) * 2 - 1;

    mouse.y =
      -(touch.clientY /
      window.innerHeight) * 2 + 1;

    const raycaster =
      new THREE.Raycaster();

    raycaster.setFromCamera(
      mouse,
      camera
    );

    const hits =
      raycaster.intersectObjects(
        monsters
      );

    if (hits.length > 0) {

      const monster =
        hits[0].object;

      if (monster.userData.caught)
        return;

      const distance =
        player.position.distanceTo(
          monster.position
        );

      if (distance < 8) {

        selectedMonster =
          monster;

        catchMonster.textContent =
          monster.userData.emoji;

        catchName.textContent =
          monster.userData.name;

        catchScreen.style.display =
          "flex";
      }

      else {

        showMessage(
          "🚶 Ga wat dichter bij het monster!"
        );
      }
    }
  }
);


/* =========================
   VANGEN
========================= */

const throwButton =
  document.getElementById("throwButton");

throwButton.addEventListener(
  "click",
  function() {

    if (!selectedMonster)
      return;

    selectedMonster.userData.caught =
      true;

    selectedMonster.visible =
      false;

    saveMonster(
      selectedMonster.userData.name,
      selectedMonster.userData.emoji
    );

    catchScreen.style.display =
      "none";

    showMessage(
      "🎉 Je hebt " +
      selectedMonster.userData.name +
      " gevangen!"
    );

    selectedMonster = null;
  }
);


/* =========================
   ANNULEREN
========================= */

document
  .getElementById("cancelButton")
  .addEventListener(
    "click",
    function() {

      catchScreen.style.display =
        "none";

      selectedMonster = null;
    }
  );


/* =========================
   MONSTERS OPSLAAN
========================= */

function getCollection() {

  return JSON.parse(
    localStorage.getItem(
      "mijnMonsters"
    ) || "[]"
  );
}


function saveMonster(name, emoji) {

  const collection =
    getCollection();

  collection.push({
    name: name,
    emoji: emoji
  });

  localStorage.setItem(
    "mijnMonsters",
    JSON.stringify(collection)
  );
}


/* =========================
   COLLECTIE
========================= */

const collection =
  document.getElementById("collection");

const monsterList =
  document.getElementById("monsterList");


document
  .getElementById("collectionButton")
  .addEventListener(
    "click",
    function() {

      monsterList.innerHTML = "";

      const saved =
        getCollection();

      if (saved.length === 0) {

        monsterList.innerHTML =
          "<p>Je hebt nog geen monsters.</p>";

      } else {

        saved.forEach(function(monster) {

          const card =
            document.createElement("div");

          card.className =
            "monsterCard";

          card.textContent =
            monster.emoji +
            " " +
            monster.name;

          monsterList.appendChild(card);
        });
      }

      collection.style.display =
        "block";
    }
  );


document
  .getElementById("closeCollection")
  .addEventListener(
    "click",
    function() {

      collection.style.display =
        "none";
    }
  );


/* =========================
   MELDING
========================= */

function showMessage(text) {

  const message =
    document.getElementById("message");

  message.textContent =
    text;

  message.style.display =
    "block";

  setTimeout(
    function() {

      message.style.display =
        "none";

    },
    2500
  );
}


/* =========================
   CAMERA + BEWEGING
========================= */

function animate() {

  requestAnimationFrame(
    animate
  );


  /*
    Als GPS NIET actief is,
    werkt de joystick.

    Als GPS WEL actief is,
    bestuurt GPS de speler.
  */

  if (!gpsActive) {

    player.position.x +=
      joystickX * 0.15;

    player.position.z +=
      joystickY * 0.15;
  }


  /*
    Camera volgt speler.
  */

  camera.position.x =
    player.position.x;

  camera.position.y =
    player.position.y + 12;

  camera.position.z =
    player.position.z + 15;


  camera.lookAt(
    player.position.x,
    player.position.y,
    player.position.z
  );


  /*
    Monsters zweven een beetje.
  */

  monsters.forEach(
    function(monster) {

      if (!monster.visible)
        return;

      monster.rotation.y += 0.01;

      monster.position.y =
        1.2 +
        Math.sin(
          Date.now() * 0.003 +
          monster.position.x
        ) * 0.15;
    }
  );


  renderer.render(
    scene,
    camera
  );
}

animate();


/* =========================
   SCHERM GROOTTE
========================= */

window.addEventListener(
  "resize",
  function() {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);

</script>

</body>
</html>
