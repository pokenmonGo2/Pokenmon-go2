<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokenmon go2</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    touch-action: none;
  }

  #game {
    width: 100vw;
    height: 100vh;
  }

  #title {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    padding: 10px 18px;
    border-radius: 15px;
    font-weight: bold;
    z-index: 10;
  }

  #collectionButton {
    position: fixed;
    top: 15px;
    right: 15px;
    border: none;
    background: white;
    padding: 12px 15px;
    border-radius: 15px;
    font-weight: bold;
    z-index: 20;
  }

  #joystick {
    position: fixed;
    bottom: 30px;
    left: 30px;
    width: 120px;
    height: 120px;
    background: rgba(255,255,255,0.35);
    border: 3px solid white;
    border-radius: 50%;
    z-index: 20;
  }

  #stick {
    position: absolute;
    width: 55px;
    height: 55px;
    left: 32px;
    top: 32px;
    background: rgba(50,50,50,0.7);
    border-radius: 50%;
  }

  #message {
    display: none;
    position: fixed;
    left: 50%;
    bottom: 180px;
    transform: translateX(-50%);
    background: white;
    padding: 15px 22px;
    border-radius: 18px;
    font-size: 17px;
    font-weight: bold;
    text-align: center;
    z-index: 30;
    box-shadow: 0 4px 15px rgba(0,0,0,0.25);
  }

  #catchScreen,
  #collectionScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    z-index: 50;
    align-items: center;
    justify-content: center;
  }

  .panel {
    width: 85%;
    max-width: 350px;
    background: white;
    border-radius: 25px;
    padding: 25px;
    text-align: center;
  }

  .monsterIcon {
    font-size: 90px;
    margin: 10px;
  }

  .orb {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 5px solid #222;
    background: linear-gradient(
      #55aaff 0%,
      #55aaff 48%,
      white 48%,
      white 52%,
      #eeeeee 52%
    );
    margin: 20px auto;
    display: block;
    transition: transform 0.3s;
  }

  .orb:active {
    transform: scale(0.8);
  }

  .mainButton {
    border: none;
    background: #3366ff;
    color: white;
    padding: 14px 25px;
    border-radius: 15px;
    font-size: 17px;
    font-weight: bold;
    margin: 5px;
  }

  .closeButton {
    border: none;
    background: #ddd;
    padding: 12px 22px;
    border-radius: 14px;
    font-weight: bold;
    margin-top: 10px;
  }

  #collectionList {
    max-height: 250px;
    overflow-y: auto;
  }

  .monsterCard {
    background: #f0f0f0;
    margin: 8px 0;
    padding: 12px;
    border-radius: 15px;
    font-weight: bold;
  }
</style>
</head>

<body>

<div id="title">🌍 Pokenmon go2</div>

<button id="collectionButton">
  🎒 Mijn monsters
</button>

<div id="game"></div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="message"></div>


<!-- VANGSCHERM -->

<div id="catchScreen">

  <div class="panel">

    <h2>👾 Monster gevonden!</h2>

    <div class="monsterIcon">👾</div>

    <p>Probeer het monster te vangen!</p>

    <button
      class="orb"
      id="orbButton">
    </button>

    <p id="catchText">
      Tik op de Monster Orb!
    </p>

    <button
      class="closeButton"
      id="closeCatch">
      Terug
    </button>

  </div>

</div>


<!-- VERZAMELING -->

<div id="collectionScreen">

  <div class="panel">

    <h2>🎒 Mijn monsters</h2>

    <div id="collectionList"></div>

    <button
      class="closeButton"
      id="closeCollection">
      Sluiten
    </button>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

// ==========================================
// BASIS
// ==========================================

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0x87ceeb);


const camera =
  new THREE.PerspectiveCamera(
    75,
    window.innerWidth /
    window.innerHeight,
    0.1,
    1000
  );


camera.position.set(
  0,
  5,
  10
);


const renderer =
  new THREE.WebGLRenderer({
    antialias: true
  });


renderer.setSize(
  window.innerWidth,
  window.innerHeight
);


document
  .getElementById("game")
  .appendChild(renderer.domElement);


// ==========================================
// LICHT
// ==========================================

const light =
  new THREE.DirectionalLight(
    0xffffff,
    2
  );

light.position.set(
  5,
  10,
  5
);

scene.add(light);


scene.add(
  new THREE.AmbientLight(
    0xffffff,
    0.5
  )
);


// ==========================================
// GROND
// ==========================================

const ground =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      100,
      100
    ),
    new THREE.MeshStandardMaterial({
      color: 0x55aa55
    })
  );


ground.rotation.x =
  -Math.PI / 2;


scene.add(ground);


// ==========================================
// SPELER
// ==========================================

const player =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      1,
      2,
      1
    ),
    new THREE.MeshStandardMaterial({
      color: 0x3366ff
    })
  );


player.position.y = 1;

scene.add(player);


// ==========================================
// MONSTER
// ==========================================

const monster =
  new THREE.Group();


const body =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      1,
      24,
      24
    ),
    new THREE.MeshStandardMaterial({
      color: 0xff8844
    })
  );


body.position.y = 1.2;

monster.add(body);


// OGEN

const eyeMaterial =
  new THREE.MeshStandardMaterial({
    color: 0xffffff
  });


const pupilMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x111111
  });


const leftEye =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      0.18,
      16,
      16
    ),
    eyeMaterial
  );


leftEye.position.set(
  -0.35,
  1.5,
  -0.85
);


monster.add(leftEye);


const rightEye =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      0.18,
      16,
      16
    ),
    eyeMaterial
  );


rightEye.position.set(
  0.35,
  1.5,
  -0.85
);


monster.add(rightEye);


// PUPILLEN

const leftPupil =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      0.08,
      12,
      12
    ),
    pupilMaterial
  );


leftPupil.position.set(
  -0.35,
  1.5,
  -1.01
);


monster.add(leftPupil);


const rightPupil =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      0.08,
      12,
      12
    ),
    pupilMaterial
  );


rightPupil.position.set(
  0.35,
  1.5,
  -1.01
);


monster.add(rightPupil);


// VOETEN

const footMaterial =
  new THREE.MeshStandardMaterial({
    color: 0xff5533
  });


const leftFoot =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      0.3,
      16,
      16
    ),
    footMaterial
  );


leftFoot.position.set(
  -0.45,
  0.35,
  -0.1
);


monster.add(leftFoot);


const rightFoot =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      0.3,
      16,
      16
    ),
    footMaterial
  );


rightFoot.position.set(
  0.45,
  0.35,
  -0.1
);


monster.add(rightFoot);


// MONSTER POSITIE

monster.position.set(
  5,
  0,
  -5
);


scene.add(monster);


// ==========================================
// JOYSTICK
// ==========================================

const joystick =
  document.getElementById(
    "joystick"
  );


const stick =
  document.getElementById(
    "stick"
  );


let joystickX = 0;
let joystickY = 0;
let touching = false;


joystick.addEventListener(
  "touchstart",
  function(event) {

    touching = true;

    event.preventDefault();

  },
  { passive: false }
);


joystick.addEventListener(
  "touchmove",
  function(event) {

    if (!touching) return;

    event.preventDefault();

    const touch =
      event.touches[0];


    const rect =
      joystick.getBoundingClientRect();


    let x =
      touch.clientX -
      (
        rect.left +
        rect.width / 2
      );


    let y =
      touch.clientY -
      (
        rect.top +
        rect.height / 2
      );


    const max = 45;


    const distance =
      Math.sqrt(
        x * x +
        y * y
      );


    if (distance > max) {

      x =
        x / distance * max;

      y =
        y / distance * max;

    }


    joystickX =
      x / max;


    joystickY =
      y / max;


    stick.style.transform =
      `translate(${x}px, ${y}px)`;

  },
  { passive: false }
);


joystick.addEventListener(
  "touchend",
  function() {

    touching = false;

    joystickX = 0;
    joystickY = 0;

    stick.style.transform =
      "translate(0px, 0px)";

  }
);


// ==========================================
// AFSTAND
// ==========================================

function getDistance() {

  return player.position.distanceTo(
    monster.position
  );

}


// ==========================================
// MONSTER AANTIKKEN
// ==========================================

const raycaster =
  new THREE.Raycaster();


const mouse =
  new THREE.Vector2();


renderer.domElement.addEventListener(
  "touchstart",
  function(event) {

    if (
      event.target.closest(
        "#joystick"
      )
    ) {
      return;
    }


    const touch =
      event.touches[0];


    mouse.x =
      (touch.clientX /
      window.innerWidth) *
      2 - 1;


    mouse.y =
      -(touch.clientY /
      window.innerHeight) *
      2 + 1;


    raycaster.setFromCamera(
      mouse,
      camera
    );


    const hits =
      raycaster.intersectObjects(
        monster.children,
        true
      );


    if (hits.length > 0) {

      if (getDistance() < 6) {

        document
          .getElementById(
            "catchScreen"
          )
          .style.display =
          "flex";

      } else {

        showMessage(
          "🚶 Je bent nog te ver weg!"
        );

      }

    }

  }
);


// ==========================================
// VANGEN
// ==========================================

let monsterCaught = false;


document
  .getElementById("orbButton")
  .addEventListener(
    "click",
    function() {

      if (monsterCaught) return;


      const orb =
        document.getElementById(
          "orbButton"
        );


      orb.style.transform =
        "scale(1.3)";


      setTimeout(
        function() {

          orb.style.transform =
            "scale(1)";

          monsterCaught = true;

          saveMonster();

          document
            .getElementById(
              "catchText"
            )
            .innerText =
            "🎉 Gelukt! Je hebt het monster gevangen!";

          setTimeout(
            function() {

              document
                .getElementById(
                  "catchScreen"
                )
                .style.display =
                "none";


              monster.visible =
                false;


              updateCollection();

            },
            1500
          );

        },
        700
      );

    }
  );


// ==========================================
// OPSLAAN
// ==========================================

function saveMonster() {

  localStorage.setItem(
    "monsterGo2Monster",
    "Firebo"
  );

}


// ==========================================
// VERZAMELING
// ==========================================

function updateCollection() {

  const list =
    document.getElementById(
      "collectionList"
    );


  list.innerHTML = "";


  const saved =
    localStorage.getItem(
      "monsterGo2Monster"
    );


  if (saved) {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "monsterCard";


    card.innerHTML =
      "👾 " + saved;


    list.appendChild(card);

  } else {

    list.innerHTML =
      "Je hebt nog geen monsters.";

  }

}


document
  .getElementById(
    "collectionButton"
  )
  .addEventListener(
    "click",
    function() {

      updateCollection();

      document
        .getElementById(
          "collectionScreen"
        )
        .style.display =
        "flex";

    }
  );


document
  .getElementById(
    "closeCollection"
  )
  .addEventListener(
    "click",
    function() {

      document
        .getElementById(
          "collectionScreen"
        )
        .style.display =
        "none";

    }
  );


document
  .getElementById(
    "closeCatch"
  )
  .addEventListener(
    "click",
    function() {

      document
        .getElementById(
          "catchScreen"
        )
        .style.display =
        "none";

    }
  );


// ==========================================
// MELDING
// ==========================================

function showMessage(text) {

  const message =
    document.getElementById(
      "message"
    );


  message.innerText =
    text;


  message.style.display =
    "block";


  setTimeout(
    function() {

      message.style.display =
        "none";

    },
    2000
  );

}


// ==========================================
// GAME LOOP
// ==========================================

function animate() {

  requestAnimationFrame(
    animate
  );


  // Speler bewegen

  player.position.x +=
    joystickX * 0.12;


  player.position.z +=
    joystickY * 0.12;


  // Camera volgt speler

  camera.position.x =
    player.position.x;


  camera.position.z =
    player.position.z + 10;


  camera.lookAt(
    player.position
  );


  // Monster draait

  if (!monsterCaught) {

    monster.rotation.y +=
      0.01;

  }


  renderer.render(
    scene,
    camera
  );

}


animate();


// ==========================================
// SCHERMFORMAAT
// ==========================================

window.addEventListener(
  "resize",
  function() {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
