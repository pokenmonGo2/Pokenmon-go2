<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokenmon go2</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    #game {
      width: 100vw;
      height: 100vh;
    }

    #title {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 10px 18px;
      border-radius: 15px;
      font-weight: bold;
      z-index: 10;
    }

    /* Joystick */
    #joystick {
      position: fixed;
      bottom: 30px;
      left: 30px;
      width: 120px;
      height: 120px;
      background: rgba(255,255,255,0.35);
      border: 3px solid white;
      border-radius: 50%;
      z-index: 20;
    }

    #stick {
      position: absolute;
      width: 55px;
      height: 55px;
      left: 32px;
      top: 32px;
      background: rgba(50,50,50,0.7);
      border-radius: 50%;
    }

    /* Monster-melding */
    #message {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 180px;
      transform: translateX(-50%);
      background: white;
      padding: 18px 25px;
      border-radius: 18px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      z-index: 30;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }
  </style>
</head>

<body>

  <div id="title">🌍 Pokenmon go2</div>

  <div id="game"></div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div id="message">
    👾 Je hebt een monster gevonden!
  </div>


  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>

    // =========================
    // BASIS 3D-WERELD
    // =========================

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x87ceeb);


    // Camera

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 5, 10);


    // Renderer

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    document
      .getElementById("game")
      .appendChild(renderer.domElement);


    // =========================
    // LICHT
    // =========================

    const light = new THREE.DirectionalLight(
      0xffffff,
      2
    );

    light.position.set(
      5,
      10,
      5
    );

    scene.add(light);


    const ambientLight =
      new THREE.AmbientLight(
        0xffffff,
        0.5
      );

    scene.add(ambientLight);


    // =========================
    // GROND
    // =========================

    const groundGeometry =
      new THREE.PlaneGeometry(
        100,
        100
      );

    const groundMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x55aa55
      });

    const ground =
      new THREE.Mesh(
        groundGeometry,
        groundMaterial
      );

    ground.rotation.x =
      -Math.PI / 2;

    scene.add(ground);


    // =========================
    // SPELER
    // =========================

    const playerGeometry =
      new THREE.BoxGeometry(
        1,
        2,
        1
      );

    const playerMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x3366ff
      });

    const player =
      new THREE.Mesh(
        playerGeometry,
        playerMaterial
      );

    player.position.y = 1;

    scene.add(player);


    // =========================
    // EIGEN MONSTER
    // =========================

    const monster =
      new THREE.Group();


    // Lichaam

    const body =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          1,
          24,
          24
        ),
        new THREE.MeshStandardMaterial({
          color: 0xff8844
        })
      );

    body.scale.set(
      1,
      1.1,
      1
    );

    body.position.y = 1.2;

    monster.add(body);


    // Linkeroog

    const eyeMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xffffff
      });

    const eyeBlackMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x111111
      });


    const leftEye =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          0.18,
          16,
          16
        ),
        eyeMaterial
      );

    leftEye.position.set(
      -0.35,
      1.5,
      -0.85
    );

    monster.add(leftEye);


    // Rechteroog

    const rightEye =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          0.18,
          16,
          16
        ),
        eyeMaterial
      );

    rightEye.position.set(
      0.35,
      1.5,
      -0.85
    );

    monster.add(rightEye);


    // Pupillen

    const leftPupil =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          0.08,
          12,
          12
        ),
        eyeBlackMaterial
      );

    leftPupil.position.set(
      -0.35,
      1.5,
      -1.01
    );

    monster.add(leftPupil);


    const rightPupil =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          0.08,
          12,
          12
        ),
        eyeBlackMaterial
      );

    rightPupil.position.set(
      0.35,
      1.5,
      -1.01
    );

    monster.add(rightPupil);


    // Voeten

    const footMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xff5533
      });


    const leftFoot =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          0.3,
          16,
          16
        ),
        footMaterial
      );

    leftFoot.scale.set(
      1.2,
      0.6,
      1
    );

    leftFoot.position.set(
      -0.45,
      0.35,
      -0.1
    );

    monster.add(leftFoot);


    const rightFoot =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          0.3,
          16,
          16
        ),
        footMaterial
      );

    rightFoot.scale.set(
      1.2,
      0.6,
      1
    );

    rightFoot.position.set(
      0.45,
      0.35,
      -0.1
    );

    monster.add(rightFoot);


    // Monster positie

    monster.position.set(
      5,
      0,
      -5
    );

    scene.add(monster);


    // =========================
    // JOYSTICK
    // =========================

    const joystick =
      document.getElementById(
        "joystick"
      );

    const stick =
      document.getElementById(
        "stick"
      );


    let joystickX = 0;
    let joystickY = 0;

    let touching = false;


    joystick.addEventListener(
      "touchstart",
      function(event) {

        touching = true;

        event.preventDefault();

      },
      { passive: false }
    );


    joystick.addEventListener(
      "touchmove",
      function(event) {

        if (!touching) return;

        event.preventDefault();

        const touch =
          event.touches[0];

        const rect =
          joystick.getBoundingClientRect();


        let x =
          touch.clientX -
          (
            rect.left +
            rect.width / 2
          );


        let y =
          touch.clientY -
          (
            rect.top +
            rect.height / 2
          );


        const max = 45;


        const distance =
          Math.sqrt(
            x * x +
            y * y
          );


        if (distance > max) {

          x =
            x / distance * max;

          y =
            y / distance * max;

        }


        joystickX =
          x / max;

        joystickY =
          y / max;


        stick.style.transform =
          `translate(${x}px, ${y}px)`;

      },
      { passive: false }
    );


    joystick.addEventListener(
      "touchend",
      function() {

        touching = false;

        joystickX = 0;
        joystickY = 0;

        stick.style.transform =
          "translate(0px, 0px)";

      }
    );


    // =========================
    // MONSTER AANTIKKEN
    // =========================

    const raycaster =
      new THREE.Raycaster();

    const mouse =
      new THREE.Vector2();


    renderer.domElement.addEventListener(
      "touchstart",
      function(event) {

        // Niet reageren als de joystick wordt gebruikt
        if (
          event.target.closest(
            "#joystick"
          )
        ) {
          return;
        }


        const touch =
          event.touches[0];


        mouse.x =
          (touch.clientX /
            window.innerWidth) *
            2 - 1;


        mouse.y =
          -(touch.clientY /
            window.innerHeight) *
            2 + 1;


        raycaster.setFromCamera(
          mouse,
          camera
        );


        const objects =
          raycaster.intersectObjects(
            monster.children,
            true
          );


        if (objects.length > 0) {

          document.getElementById(
            "message"
          ).style.display =
            "block";


          setTimeout(
            function() {

              document.getElementById(
                "message"
              ).style.display =
                "none";

            },
            2000
          );

        }

      }
    );


    // =========================
    // GAME LOOP
    // =========================

    function animate() {

      requestAnimationFrame(
        animate
      );


      // Speler bewegen

      player.position.x +=
        joystickX * 0.12;


      player.position.z +=
        joystickY * 0.12;


      // Camera volgt speler

      camera.position.x =
        player.position.x;


      camera.position.z =
        player.position.z + 10;


      camera.lookAt(
        player.position
      );


      // Monster beweegt een beetje

      monster.rotation.y +=
        0.01;


      renderer.render(
        scene,
        camera
      );

    }


    animate();


    // =========================
    // SCHERM AANPASSEN
    // =========================

    window.addEventListener(
      "resize",
      function() {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
