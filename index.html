<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pokenmon go2</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    #ui {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
    }

    #title,
    #locationStatus {
      display: inline-block;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 8px 12px;
      border-radius: 12px;
      margin-bottom: 5px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      margin: 3px;
      font-size: 15px;
      font-weight: bold;
    }

    #gpsButton {
      background: #333;
      color: white;
    }

    #collectionButton {
      background: #7b3ff2;
      color: white;
    }

    #message {
      position: fixed;
      left: 50%;
      bottom: 140px;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 18px;
      border-radius: 14px;
      display: none;
      text-align: center;
      max-width: 80%;
    }

    #joystick {
      position: fixed;
      left: 25px;
      bottom: 25px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(0,0,0,0.25);
      z-index: 15;
    }

    #stick {
      position: absolute;
      left: 35px;
      top: 35px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
    }

    #collection,
    #catchScreen {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(0,0,0,0.93);
      color: white;
      display: none;
      box-sizing: border-box;
    }

    #collection {
      padding: 25px;
      overflow-y: auto;
    }

    #collection h2 {
      margin-top: 0;
    }

    .monsterCard {
      background: #222;
      border-radius: 15px;
      padding: 15px;
      margin: 10px 0;
      font-size: 18px;
    }

    #closeCollection {
      background: #e74c3c;
      color: white;
    }

    #catchScreen {
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }

    #catchMonster {
      font-size: 100px;
      margin: 20px;
    }

    #throwButton {
      background: #ff8c00;
      color: white;
    }

    #cancelButton {
      background: #555;
      color: white;
    }
  </style>
</head>

<body>

<div id="game"></div>

<div id="ui">
  <div id="title">🌍 Pokenmon go2</div><br>

  <button id="gpsButton">📍 GPS starten</button>
  <button id="collectionButton">🎒 Mijn monsters</button>

  <div id="locationStatus">
    GPS staat uit
  </div>
</div>

<div id="message"></div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="collection">
  <h2>🎒 Mijn monsters</h2>
  <div id="monsterList"></div>
  <button id="closeCollection">Sluiten</button>
</div>

<div id="catchScreen">
  <h1>Een monster!</h1>

  <div id="catchMonster">👾</div>

  <h2 id="catchName">Monster</h2>

  <button id="throwButton">
    🟠 Gooi Monster Orb
  </button>

  <button id="cancelButton">
    Terug
  </button>
</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =====================================
   SCENE
===================================== */

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0x87ceeb);

const camera =
  new THREE.PerspectiveCamera(
    75,
    window.innerWidth /
    window.innerHeight,
    0.1,
    1000
  );

const renderer =
  new THREE.WebGLRenderer({
    antialias: true
  });

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

document
  .getElementById("game")
  .appendChild(renderer.domElement);


/* =====================================
   LICHT
===================================== */

const sunlight =
  new THREE.DirectionalLight(
    0xffffff,
    1
  );

sunlight.position.set(
  20,
  30,
  10
);

scene.add(sunlight);

scene.add(
  new THREE.AmbientLight(
    0xffffff,
    0.6
  )
);


/* =====================================
   GROND
===================================== */

const ground =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      1000,
      1000
    ),
    new THREE.MeshLambertMaterial({
      color: 0x4caf50
    })
  );

ground.rotation.x =
  -Math.PI / 2;

scene.add(ground);


/* =====================================
   WEG
===================================== */

const road =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      20,
      1000
    ),
    new THREE.MeshLambertMaterial({
      color: 0x555555
    })
  );

road.rotation.x =
  -Math.PI / 2;

road.position.y =
  0.01;

scene.add(road);


/* =====================================
   SPELER
===================================== */

const player =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      1.5,
      2,
      1.5
    ),
    new THREE.MeshLambertMaterial({
      color: 0x2196f3
    })
  );

player.position.set(
  0,
  1,
  0
);

scene.add(player);


/* =====================================
   MONSTER TYPES
===================================== */

const monsterTypes = [

  {
    name: "Firebo",
    emoji: "🔥",
    color: 0xff5722
  },

  {
    name: "Leafy",
    emoji: "🌿",
    color: 0x4caf50
  },

  {
    name: "Aquari",
    emoji: "💧",
    color: 0x2196f3
  },

  {
    name: "Voltix",
    emoji: "⚡",
    color: 0xffeb3b
  },

  {
    name: "Rocko",
    emoji: "🪨",
    color: 0x795548
  },

  {
    name: "Frosti",
    emoji: "❄️",
    color: 0x80deea
  }

];


/* =====================================
   MONSTERS ARRAY
===================================== */

const monsters = [];


/* =====================================
   MONSTER MAKEN
===================================== */

function createMonster(
  type,
  x,
  z
) {

  const geometry =
    new THREE.SphereGeometry(
      1.2,
      24,
      24
    );

  const material =
    new THREE.MeshLambertMaterial({
      color: type.color
    });

  const monster =
    new THREE.Mesh(
      geometry,
      material
    );

  monster.position.set(
    x,
    1.2,
    z
  );

  monster.userData = {
    name: type.name,
    emoji: type.emoji,
    caught: false
  };

  scene.add(monster);

  monsters.push(monster);

  return monster;
}


/* =====================================
   START MONSTERS
===================================== */

createMonster(
  monsterTypes[0],
  8,
  -12
);

createMonster(
  monsterTypes[1],
  -10,
  -25
);

createMonster(
  monsterTypes[2],
  12,
  -40
);


/* =====================================
   BOMEN
===================================== */

function createTree(x, z) {

  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.4,
        0.5,
        2,
        8
      ),
      new THREE.MeshLambertMaterial({
        color: 0x795548
      })
    );

  trunk.position.set(
    x,
    1,
    z
  );

  scene.add(trunk);


  const leaves =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        1.8,
        12,
        12
      ),
      new THREE.MeshLambertMaterial({
        color: 0x2e7d32
      })
    );

  leaves.position.set(
    x,
    3,
    z
  );

  scene.add(leaves);
}


/* =====================================
   BOMEN PLAATSEN
===================================== */

for (
  let z = -300;
  z <= 300;
  z += 15
) {

  createTree(-15, z);

  createTree(
    15,
    z + 7
  );
}


/* =====================================
   HUIZEN
===================================== */

function createHouse(x, z) {

  const house =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        5,
        4,
        5
      ),
      new THREE.MeshLambertMaterial({
        color: 0xffcc80
      })
    );

  house.position.set(
    x,
    2,
    z
  );

  scene.add(house);


  const roof =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        4,
        2.5,
        4
      ),
      new THREE.MeshLambertMaterial({
        color: 0xd84315
      })
    );

  roof.position.set(
    x,
    5,
    z
  );

  roof.rotation.y =
    Math.PI / 4;

  scene.add(roof);
}

createHouse(
  -25,
  -20
);

createHouse(
  25,
  -50
);


/* =====================================
   GPS
===================================== */

let gpsActive = false;

let gpsOriginLat = null;
let gpsOriginLon = null;

let gpsWatchId = null;

const locationStatus =
  document.getElementById(
    "locationStatus"
  );

const gpsButton =
  document.getElementById(
    "gpsButton"
  );


function startGPS() {

  if (
    !navigator.geolocation
  ) {

    locationStatus.textContent =
      "❌ GPS wordt niet ondersteund.";

    return;
  }


  locationStatus.textContent =
    "📡 GPS zoeken...";


  gpsWatchId =
    navigator.geolocation.watchPosition(

      function(position) {

        const latitude =
          position.coords.latitude;

        const longitude =
          position.coords.longitude;


        /* Eerste positie */

        if (
          gpsOriginLat === null
        ) {

          gpsOriginLat =
            latitude;

          gpsOriginLon =
            longitude;

          locationStatus.textContent =
            "✅ GPS actief";

          /*
            Bij de eerste GPS-locatie
            verschijnen monsters rondom jou.
          */

          spawnGPSMonsters();
        }


        const metersPerDegree =
          111320;


        const latitudeMeters =
          (latitude -
            gpsOriginLat) *
          metersPerDegree;


        const longitudeMeters =
          (longitude -
            gpsOriginLon) *
          metersPerDegree *
          Math.cos(
            gpsOriginLat *
            Math.PI / 180
          );


        /*
          5 meter = 1 game-unit
        */

        const scale = 5;


        player.position.x =
          longitudeMeters /
          scale;


        player.position.z =
          -latitudeMeters /
          scale;


        locationStatus.textContent =
          "📍 GPS actief";
      },


      function(error) {

        locationStatus.textContent =
          "❌ GPS kon niet worden gebruikt.";

        console.log(error);
      },


      {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 10000
      }
    );


  gpsActive = true;

  gpsButton.textContent =
    "📍 GPS actief";
}


gpsButton.addEventListener(
  "click",
  startGPS
);


/* =====================================
   GPS MONSTERS SPAWNEN
===================================== */

function spawnGPSMonsters() {

  /*
    We maken 8 monsters
    op verschillende plekken
    rondom de speler.
  */

  for (
    let i = 0;
    i < 8;
    i++
  ) {

    const type =
      monsterTypes[
        Math.floor(
          Math.random() *
          monsterTypes.length
        )
      ];


    /*
      Tussen ongeveer
      10 en 60 game-units.

      Omdat 5 meter = 1 game-unit,
      staan ze ongeveer
      50 tot 300 meter verderop.
    */

    const angle =
      Math.random() *
      Math.PI * 2;


    const distance =
      10 +
      Math.random() * 50;


    const x =
      player.position.x +
      Math.cos(angle) *
      distance;


    const z =
      player.position.z +
      Math.sin(angle) *
      distance;


    createMonster(
      type,
      x,
      z
    );
  }


  showMessage(
    "👾 Er zijn nieuwe monsters in de buurt!"
  );
}


/* =====================================
   JOYSTICK
===================================== */

const joystick =
  document.getElementById(
    "joystick"
  );

const stick =
  document.getElementById(
    "stick"
  );

let joystickActive =
  false;

let joystickX = 0;
let joystickY = 0;


joystick.addEventListener(
  "touchstart",
  function(event) {

    joystickActive =
      true;

    event.preventDefault();

  },
  {
    passive: false
  }
);


joystick.addEventListener(
  "touchmove",
  function(event) {

    if (
      !joystickActive
    ) return;


    const touch =
      event.touches[0];


    const rect =
      joystick.getBoundingClientRect();


    let x =
      touch.clientX -
      (
        rect.left +
        rect.width / 2
      );


    let y =
      touch.clientY -
      (
        rect.top +
        rect.height / 2
      );


    const maxDistance =
      35;


    const distance =
      Math.sqrt(
        x*x +
        y*y
      );


    if (
      distance >
      maxDistance
    ) {

      x =
        x /
        distance *
        maxDistance;

      y =
        y /
        distance *
        maxDistance;
    }


    joystickX =
      x /
      maxDistance;


    joystickY =
      y /
      maxDistance;


    stick.style.transform =
      `translate(${x}px, ${y}px)`;


    event.preventDefault();

  },
  {
    passive: false
  }
);


joystick.addEventListener(
  "touchend",
  function() {

    joystickActive =
      false;

    joystickX = 0;
    joystickY = 0;

    stick.style.transform =
      "translate(0px, 0px)";
  }
);


/* =====================================
   VANGSCHERM
===================================== */

let selectedMonster =
  null;

const catchScreen =
  document.getElementById(
    "catchScreen"
  );

const catchMonster =
  document.getElementById(
    "catchMonster"
  );

const catchName =
  document.getElementById(
    "catchName"
  );


renderer.domElement.addEventListener(
  "touchstart",
  function(event) {

    const touch =
      event.touches[0];


    const mouse =
      new THREE.Vector2();


    mouse.x =
      (
        touch.clientX /
        window.innerWidth
      ) * 2 - 1;


    mouse.y =
      -(
        touch.clientY /
        window.innerHeight
      ) * 2 + 1;


    const raycaster =
      new THREE.Raycaster();


    raycaster.setFromCamera(
      mouse,
      camera
    );


    const hits =
      raycaster.intersectObjects(
        monsters
      );


    if (
      hits.length === 0
    ) return;


    const monster =
      hits[0].object;


    if (
      monster.userData.caught
    ) return;


    const distance =
      player.position.distanceTo(
        monster.position
      );


    if (
      distance < 8
    ) {

      selectedMonster =
        monster;


      catchMonster.textContent =
        monster.userData.emoji;


      catchName.textContent =
        monster.userData.name;


      catchScreen.style.display =
        "flex";
    }

    else {

      showMessage(
        "🚶 Ga dichter naar het monster!"
      );
    }

  }
);


/* =====================================
   VANGEN
===================================== */

document
  .getElementById(
    "throwButton"
  )
  .addEventListener(
    "click",
    function() {

      if (
        !selectedMonster
      ) return;


      selectedMonster.userData.caught =
        true;


      selectedMonster.visible =
        false;


      saveMonster(
        selectedMonster.userData.name,
        selectedMonster.userData.emoji
      );


      catchScreen.style.display =
        "none";


      showMessage(
        "🎉 Je hebt " +
        selectedMonster.userData.name +
        " gevangen!"
      );


      selectedMonster =
        null;
    }
  );


/* =====================================
   ANNULEREN
===================================== */

document
  .getElementById(
    "cancelButton"
  )
  .addEventListener(
    "click",
    function() {

      catchScreen.style.display =
        "none";

      selectedMonster =
        null;
    }
  );


/* =====================================
   OPSLAAN
===================================== */

function getCollection() {

  return JSON.parse(
    localStorage.getItem(
      "mijnMonsters"
    ) || "[]"
  );
}


function saveMonster(
  name,
  emoji
) {

  const collection =
    getCollection();


  collection.push({
    name: name,
    emoji: emoji
  });


  localStorage.setItem(
    "mijnMonsters",
    JSON.stringify(
      collection
    )
  );
}


/* =====================================
   COLLECTIE
===================================== */

const collection =
  document.getElementById(
    "collection"
  );

const monsterList =
  document.getElementById(
    "monsterList"
  );


document
  .getElementById(
    "collectionButton"
  )
  .addEventListener(
    "click",
    function() {

      monsterList.innerHTML =
        "";


      const saved =
        getCollection();


      if (
        saved.length === 0
      ) {

        monsterList.innerHTML =
          "<p>Je hebt nog geen monsters.</p>";

      } else {

        saved.forEach(
          function(monster) {

            const card =
              document.createElement(
                "div"
              );

            card.className =
              "monsterCard";

            card.textContent =
              monster.emoji +
              " " +
              monster.name;

            monsterList.appendChild(
              card
            );
          }
        );
      }


      collection.style.display =
        "block";
    }
  );


document
  .getElementById(
    "closeCollection"
  )
  .addEventListener(
    "click",
    function() {

      collection.style.display =
        "none";
    }
  );


/* =====================================
   MELDING
===================================== */

function showMessage(
  text
) {

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.style.display =
    "block";


  setTimeout(
    function() {

      message.style.display =
        "none";

    },
    2500
  );
}


/* =====================================
   GAME LOOP
===================================== */

function animate() {

  requestAnimationFrame(
    animate
  );


  /*
    Zonder GPS:
    joystick gebruiken.
  */

  if (
    !gpsActive
  ) {

    player.position.x +=
      joystickX * 0.15;

    player.position.z +=
      joystickY * 0.15;
  }


  /*
    Camera volgt speler.
  */

  camera.position.x =
    player.position.x;

  camera.position.y =
    player.position.y + 12;

  camera.position.z =
    player.position.z + 15;


  camera.lookAt(
    player.position.x,
    player.position.y,
    player.position.z
  );


  /*
    Monsters bewegen
    een beetje.
  */

  monsters.forEach(
    function(monster) {

      if (
        !monster.visible
      ) return;


      monster.rotation.y +=
        0.01;


      monster.position.y =
        1.2 +
        Math.sin(
          Date.now() *
          0.003 +
          monster.position.x
        ) *
        0.15;
    }
  );


  renderer.render(
    scene,
    camera
  );
}


animate();


/* =====================================
   RESIZE
===================================== */

window.addEventListener(
  "resize",
  function() {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);

</script>

</body>
</html>
